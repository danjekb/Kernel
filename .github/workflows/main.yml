name: Apply Kernel Patches

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Gałąź źródłowa (np. bpf)'
        required: true
        default: 'bpf'
      new_branch:
        description: 'Nazwa nowej gałęzi (opcjonalnie)'
        required: false
        default: ''

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Create new branch (if specified)
        if: github.event.inputs.new_branch != ''
        run: git checkout -b ${{ github.event.inputs.new_branch }}

      - name: Install dos2unix
        run: sudo apt-get update && sudo apt-get install -y dos2unix

      - name: Clean up patch files
        run: |
          for f in patch1.patch patch2.patch patch3.patch; do
            if [ -f "$f" ]; then
              echo "=== Przetwarzanie $f ==="
              # Konwersja CRLF -> LF
              dos2unix "$f"
              # Usunięcie końcowych spacji i tabulatorów
              sed -i 's/[ \t]*$//' "$f"
              # Dodanie końcowej nowej linii, jeśli brak
              tail -c1 "$f" | read -r _ || echo >> "$f"
              # Wyświetlenie pierwszych 30 linii z widocznymi znakami (diagnostyka)
              echo "--- Pierwsze 30 linii $f (cat -A) ---"
              head -n 30 "$f" | cat -A
              echo "--- Koniec diagnostyki ---"
            else
              echo "Błąd: Brak pliku $f"
              exit 1
            fi
          done

      - name: Apply patch1 (sys.c) with git apply (3-way)
        id: apply1
        continue-on-error: true
        run: git apply --3way --ignore-whitespace --verbose patch1.patch

      - name: Fallback to patch for patch1
        if: steps.apply1.outcome == 'failure'
        run: |
          echo "git apply nie zadziałało, próbuję patch -p1"
          patch -p1 --verbose < patch1.patch
          git add -A

      - name: Commit patch1
        run: |
          git add -A
          git commit -m "kernel: fake uname for selected processes in sys_newuname" \
                       -m "Override uname() release string to 5.10.200 for bpfloader, netd, etc."

      - name: Apply patch2 (Kconfig) with git apply
        id: apply2
        continue-on-error: true
        run: git apply --3way --ignore-whitespace --verbose patch2.patch

      - name: Fallback to patch for patch2
        if: steps.apply2.outcome == 'failure'
        run: |
          patch -p1 --verbose < patch2.patch
          git add -A

      - name: Commit patch2
        run: |
          git add -A
          git commit -m "init/Kconfig: add FAKE_UNAME configuration option" \
                       -m "Allows selecting fake kernel version (5.4, 5.10, or 5.15) for Android BPF compatibility."

      - name: Apply patch3 (defconfig) with git apply
        id: apply3
        continue-on-error: true
        run: git apply --3way --ignore-whitespace --verbose patch3.patch

      - name: Fallback to patch for patch3
        if: steps.apply3.outcome == 'failure'
        run: |
          patch -p1 --verbose < patch3.patch
          git add -A

      - name: Commit patch3
        run: |
          git add -A
          git commit -m "arm64: defconfig: enable FAKE_UNAME for a52sxq"

      - name: Push changes
        run: |
          if [ -n "${{ github.event.inputs.new_branch }}" ]; then
            git push origin ${{ github.event.inputs.new_branch }}
          else
            git push origin ${{ github.event.inputs.target_branch }}
          fi
