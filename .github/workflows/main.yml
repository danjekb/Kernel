name: Apply Kernel Patches (direct edit)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Gałąź źródłowa (np. bpf)'
        required: true
        default: 'bpf'
      new_branch:
        description: 'Nazwa nowej gałęzi (opcjonalnie)'
        required: false
        default: ''

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Create new branch (if specified)
        if: github.event.inputs.new_branch != ''
        run: git checkout -b ${{ github.event.inputs.new_branch }}

      # ---- Patch 1: kernel/sys.c ----
      - name: Apply patch1 (kernel/sys.c)
        run: |
          # Wstaw nowy blok BEZPOŚREDNIO PO linii z memcpy
          sed -i '/memcpy(&tmp, utsname(), sizeof(tmp));/a \
          #ifdef CONFIG_FAKE_UNAME\
          \	if (!strncmp(current->comm, "bpfloader", 9) ||\
          \	    !strncmp(current->comm, "netbpfload", 10) ||\
          \	    !strncmp(current->comm, "netd", 4) ||\
          \	    !strncmp(current->comm, "uprobestats", 11)) {\
          \
          \		strcpy(tmp.release, "5.10.200");\
          \
          \		pr_info("fake uname: %s pid=%d release=%s\\n",\
          \			current->comm, current->pid, tmp.release);\
          \	}\
          \#endif' kernel/sys.c

      - name: Commit patch1
        run: |
          git add kernel/sys.c
          git commit -m "kernel: fake uname for selected processes in sys_newuname" \
                       -m "Override uname() release string to 5.10.200 for bpfloader, netd, etc."

      # ---- Patch 2: init/Kconfig ----
      - name: Apply patch2 (init/Kconfig)
        run: |
          # Sprawdź, czy istnieje linia "source \"init/Kconfig.gki\""
          if grep -q '^source "init/Kconfig.gki"' init/Kconfig; then
            echo "Znaleziono source, wstawiam przed nią"
            sed -i '/^source "init\/Kconfig.gki"/i \
            config FAKE_UNAME\
            \	bool "Fake uname for Android BPF compatibility"\
            \	help\
            \	  This option allows the kernel to report a fake (newer) kernel release\
            \	  string to specific userspace processes (e.g. bpfloader, netd) that\
            \	  require a higher version than the actual kernel. The fake version is\
            \	  used only in the uname() system call for selected processes.\
            \
            \	  If unsure, say N.\
            \
            \choice\
            \	prompt "Fake uname version"\
            \	depends on FAKE_UNAME\
            \	default FAKE_UNAME_5_10\
            \	help\
            \	  Select which kernel version string should be reported when fake uname\
            \	  is active.\
            \
            \config FAKE_UNAME_5_4\
            \	bool "5.4"\
            \
            \config FAKE_UNAME_5_10\
            \	bool "5.10"\
            \
            \config FAKE_UNAME_5_15\
            \	bool "5.15"\
            \
            \endchoice' init/Kconfig
          else
            echo "Nie znaleziono source, wstawiam na koniec pliku (przed ewentualnym endmenu)"
            # Jeśli plik kończy się "endmenu", to wstaw przed nim, inaczej na koniec
            if grep -q '^endmenu' init/Kconfig; then
              sed -i '/^endmenu/i \
            config FAKE_UNAME\
            \	bool "Fake uname for Android BPF compatibility"\
            \	help\
            \	  This option allows the kernel to report a fake (newer) kernel release\
            \	  string to specific userspace processes (e.g. bpfloader, netd) that\
            \	  require a higher version than the actual kernel. The fake version is\
            \	  used only in the uname() system call for selected processes.\
            \
            \	  If unsure, say N.\
            \
            \choice\
            \	prompt "Fake uname version"\
            \	depends on FAKE_UNAME\
            \	default FAKE_UNAME_5_10\
            \	help\
            \	  Select which kernel version string should be reported when fake uname\
            \	  is active.\
            \
            \config FAKE_UNAME_5_4\
            \	bool "5.4"\
            \
            \config FAKE_UNAME_5_10\
            \	bool "5.10"\
            \
            \config FAKE_UNAME_5_15\
            \	bool "5.15"\
            \
            \endchoice' init/Kconfig
            else
              # append na koniec
              cat >> init/Kconfig << 'EOF'

            config FAKE_UNAME
              bool "Fake uname for Android BPF compatibility"
              help
                This option allows the kernel to report a fake (newer) kernel release
                string to specific userspace processes (e.g. bpfloader, netd) that
                require a higher version than the actual kernel. The fake version is
                used only in the uname() system call for selected processes.

                If unsure, say N.

            choice
              prompt "Fake uname version"
              depends on FAKE_UNAME
              default FAKE_UNAME_5_10
              help
                Select which kernel version string should be reported when fake uname
                is active.

            config FAKE_UNAME_5_4
              bool "5.4"

            config FAKE_UNAME_5_10
              bool "5.10"

            config FAKE_UNAME_5_15
              bool "5.15"

            endchoice
            EOF
            fi
          fi

      - name: Commit patch2
        run: |
          git add init/Kconfig
          git commit -m "init/Kconfig: add FAKE_UNAME configuration option" \
                       -m "Allows selecting fake kernel version (5.4, 5.10, or 5.15) for Android BPF compatibility."

      # ---- Patch 3: defconfig ----
      - name: Apply patch3 (defconfig)
        run: |
          DEFCONFIG="arch/arm64/configs/vendor/a52sxq_kor_single_defconfig"
          # Zmiana linii z komentarzami na aktywne
          sed -i 's/^# CONFIG_CGROUP_PIDS is not set/CONFIG_CGROUP_PIDS=y/' "$DEFCONFIG"
          sed -i 's/^# CONFIG_CGROUP_RDMA is not set/CONFIG_CGROUP_RDMA=y/' "$DEFCONFIG"
          sed -i 's/^# CONFIG_CGROUP_DEVICE is not set/CONFIG_CGROUP_DEVICE=y/' "$DEFCONFIG"
          sed -i 's/^# CONFIG_CGROUP_PERF is not set/CONFIG_CGROUP_PERF=y/' "$DEFCONFIG"
          # Dodanie dwóch linii na końcu pliku (jeśli jeszcze nie istnieją)
          echo "" >> "$DEFCONFIG"
          echo "CONFIG_FAKE_UNAME=y" >> "$DEFCONFIG"
          echo "CONFIG_FAKE_UNAME_5_10=y" >> "$DEFCONFIG"

      - name: Commit patch3
        run: |
          git add arch/arm64/configs/vendor/a52sxq_kor_single_defconfig
          git commit -m "arm64: defconfig: enable FAKE_UNAME for a52sxq"

      - name: Push changes
        run: |
          if [ -n "${{ github.event.inputs.new_branch }}" ]; then
            git push origin ${{ github.event.inputs.new_branch }}
          else
            git push origin ${{ github.event.inputs.target_branch }}
          fi
