name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build kernel zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison cpio curl flex git libssl-dev \
            libelf-dev make python3 unzip zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Cache Clang toolchain
        uses: actions/cache@v4
        with:
          path: toolchain/clang
          key: clang-r530567

      - name: Cache magiskboot
        uses: actions/cache@v4
        with:
          path: toolchain/magiskboot
          key: magiskboot-v30.7

      - name: Cache avbtool
        uses: actions/cache@v4
        with:
          path: toolchain/avbtool
          key: avbtool-aosp-main

      - name: Build kernel + flashable zip
        run: |
          chmod +x build_kernel_zip.sh
          # Bypass repo name check — not needed in CI
          sed -i '/android_kernel_samsung_sm7325_a52s_5g/d' build_kernel_zip.sh
          # Override Clang URL
          sed -i 's|CLANG_URL=.*|CLANG_URL="https://github.com/danjekb/tools/releases/download/clang/main-clang-r530567.tar.gz"|' build_kernel_zip.sh
          bash build_kernel_zip.sh

      - name: Find output zip
        id: find_zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1)
          if [[ -z "$ZIP" ]]; then
            echo "ERROR: No zip file found after build" >&2
            exit 1
          fi
          echo "zip_name=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload kernel zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_zip.outputs.zip_name }}
          path: ${{ steps.find_zip.outputs.zip_name }}
          retention-days: 30
          if-no-files-found: error
